name: Build and Release Gem

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Gem
    runs-on: ubuntu-latest
    outputs:
      semantic-version: ${{ steps.determine-version.outputs.SemVer }}
      pre-release-label: ${{ steps.determine-version.outputs.PreReleaseLabel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        uses: crown0815/git-versioner@v0.20.1
        id: determine-version
        with:
          as-release: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Install dependencies
        run: bundle install

      - name: Update .gemspec version
        run: |
          sed -i "s/\(spec\.version\s*=\s*\)['\"].*['\"]/\1'${{ steps.determine-version.outputs.SemVer }}'/" *.gemspec

      - name: Build gem
        run: gem build *.gemspec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: '*.gem'
          name: gem

  test:
    name: Test Gem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: ruby test/test_*.rb

      - name: Upload test artifacts (if failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: |
            test/verification/*.received.pdf
            test/verification/*.verified.pdf
          name: test-results-${{ matrix.os }}
          if-no-files-found: error

  pdf-diff:
    name: Generate PDF diffs (${{ matrix.os }})
    needs: test
    runs-on: macos-latest
    if: ${{ always() && needs.test.result == 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Download test PDFs
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-results-${{ matrix.os }}
          path: received

      - name: Install diff-pdf
        if: steps.download.outcome == 'success'
        run: brew install diff-pdf

      - name: Generate diffs
        if: steps.download.outcome == 'success'
        run: |
          shopt -s nullglob
          for received_pdf in received/*.received.pdf; do
            filename="${received_pdf##*/}"
            testcase="${filename%.received.pdf}"
            verified_pdf="received/$testcase.verified.pdf"

            diff_pdf="received/$testcase.diff.pdf"
            diff-pdf --output-diff="$diff_pdf" "$verified_pdf" "$received_pdf" || status=$?
            if [[ "${status:-0}" -gt 1 ]]; then
              echo "::warning::diff-pdf failed for $received_pdf with exit code $status"
            fi
            unset status
          done

      - name: Extend test results
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: received/*
          overwrite: true

  release:
    name: Release Gem
    needs: [ build, test ]
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.pre-release-label == '' }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: gem

      - name: Create a Release
        uses: comnoco/create-release-action@v2.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{needs.build.outputs.semantic-version}}"
          release_name: "v${{needs.build.outputs.semantic-version}}"
          prerelease: ${{ needs.build.outputs.pre-release-label != '' }}

      - name: Publish gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push *.gem
